name: Build Android APK (No Android Studio Needed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK Platforms & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Frontend Dependencies & Build Web
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle.log

      - name: Upload Gradle Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Error-Log
          path: frontend/android/gradle.log

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-RADAR-Debug-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.1
          name: "AI RADAR v1.0.1 (Offline-First Autonomous Android APK)"
          body: |
            ### 🚀 AI RADAR Android App v1.0.1 for Varun Foundry
            - **Autonomous Offline-First Engine**: Works anywhere on phone (WiFi, 4G/5G, or Airplane mode) with 40 preloaded AI intelligence stories and 13 feeds.
            - **Safe Area Insets**: Fixed layout under battery, clock, and Android gesture navigation bars.
            - **Persistent API Keys**: Instant local & native Android preferences storage with live test button.
            
            **Direct Download:** Download `app-debug.apk` below on your phone to install!
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
