name: Build Android APK (No Android Studio Needed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK Platforms & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Frontend Dependencies & Build Web
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle.log

      - name: Upload Gradle Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Error-Log
          path: frontend/android/gradle.log

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-RADAR-Debug-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.3
          name: "AI RADAR v1.0.3 (Today Badges, Publication Timestamps & Auto-Save)"
          body: |
            ### 🚀 AI RADAR Android App v1.0.3 for Varun Foundry
            - **Today Badges & Real-Time Timestamps**: Every card now clearly shows publication recency (e.g. `● TODAY`, `Today • 2h ago`, `Yesterday`, or date).
            - **Instant Keystroke Auto-Save**: Gemini API key automatically persists on every keystroke and on blur with green indicator.
            - **Autonomous Scan Engine**: Tapping 'Scan' runs an on-device radar pass, calls Gemini 2.5 Flash if key is configured, reshuffles deck, and displays floating HUD alert.
            
            **Direct Download:** Download `app-debug.apk` below on your phone to install!
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
